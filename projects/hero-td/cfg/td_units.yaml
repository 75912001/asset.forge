version: 1
category: "td_units"
fields:
  - key: "id"
    label: "ID"
    type: "uint32"
    required: true
  - key: "name"
    label: "名称"
    type: "string"
    required: true
  - key: "role"
    label: "职责"
    type: "enum"
    enum: "td_role"
    required: true
  - key: "icon"
    label: "头像 / 法阵"
    type: "png"
    required: true
  - key: "weapon"
    label: "武器 / 羽扇"
    type: "png"
    required: false
  - key: "cost"
    label: "部署灵气"
    type: "uint32"
    required: true
  - key: "hp"
    label: "生命"
    type: "uint32"
    required: true
  - key: "damage"
    label: "每次伤害"
    type: "uint32"
    required: true
  - key: "interval_ms"
    label: "攻击间隔(毫秒)"
    type: "uint32"
    required: true
  - key: "range_percent"
    label: "射程(100 = 1格)"
    type: "uint32"
    required: true
  - key: "slow_percent"
    label: "减速后速度(百分比)"
    type: "uint32"
    required: true
  - key: "slow_duration_ms"
    label: "减速持续(毫秒)"
    type: "uint32"
    required: true
  - key: "production"
    label: "每次产出灵气"
    type: "uint32"
    required: true
  - key: "production_interval_ms"
    label: "产出间隔(毫秒)"
    type: "uint32"
    required: true
  - key: "unlock_level"
    label: "解锁所需通关ID(0 = 初始)"
    type: "uint32"
    required: true
  - key: "crit_chance_percent"
    label: "暴击率(百分比)"
    type: "uint32"
    required: false
